name: Weekly Recommendations + Daily Alert

on:
  schedule:
    - cron: '30 13 * * 1-5'   # Lunes a viernes 8:30am Bogota (13:30 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests yfinance

      - name: Run daily alert + weekly recommendations
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          IBKR_FLEX_TOKEN:      ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID:   ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: python generate_recommendations.py

      - name: Commit JSONs al repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add prices.json
          git add portfolio_history.json 2>/dev/null || true
          git add recommendations.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update $(date +'%Y-%m-%d %H:%M') UTC"
          git push
