name: Weekly Recommendations + Daily Alert

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run daily alert + weekly recommendations
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_recommendations.py

      - name: Commit recommendations.json
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add recommendations.json
          git diff --staged --quiet || git commit -m "Recommendations $(date +'%Y-%m-%d')"
          git push
